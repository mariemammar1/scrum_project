{% extends "base.html" %}

{% block content %}

<h2>Inventory</h2>

<!-- ➕ CREATE ARTICLE -->
<h4>Create Article</h4>
<form method="POST" action="/article/create">
    <input name="title" placeholder="Title" class="form-control mb-2">
    <input name="content" placeholder="Content" class="form-control mb-2">
    <input name="price" placeholder="Price" class="form-control mb-2">
    <input name="stock" placeholder="Stock" class="form-control mb-2">

    <button class="btn btn-success">Create</button>
</form>

<hr>

<!-- 📥 STOCK ENTRY -->
<h4>Stock Entry</h4>
<form method="POST" action="/stock/entry">
    <input name="article_id" placeholder="Article ID" class="form-control mb-2">
    <input name="quantity" placeholder="Quantity" class="form-control mb-2">
    <button class="btn btn-primary">Add Stock</button>
</form>

<!-- 📤 STOCK EXIT -->
<h4 class="mt-3">Stock Exit</h4>
<form method="POST" action="/stock/exit">
    <input name="article_id" placeholder="Article ID" class="form-control mb-2">
    <input name="quantity" placeholder="Quantity" class="form-control mb-2">
    <button class="btn btn-danger">Remove Stock</button>
</form>

<hr>
<h2 class="mb-3">📦 Inventory Management</h2>
<!-- TABLE -->
<div class="card p-3 mb-4">
<table class="table table-hover">
    <thead>
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Stock</th>
            <th>Price</th>
        </tr>
    </thead>

    <tbody>
        {% for a in articles %}
        <tr>
            <td>{{ a.id }}</td>
            <td>{{ a.title }}</td>
            <td><span class="badge bg-primary">{{ a.stock }}</span></td>
            <td>{{ a.price }} €</td>
        </tr>
        {% endfor %}
    </tbody>
</table>
</div>

{% endblock %}
